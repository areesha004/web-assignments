<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order Confirmation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-5 text-center">
    <h1 class="mb-4">Thank you for your order!</h1>
    <p>Your order has been placed successfully.</p>
    <p>Order ID: <strong id="orderId"></strong></p>
    <a class="btn btn-primary mt-3">Back to Home</a>
  </div>

  <script>
    // Get the order ID from query string
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('id');
    if (orderId) {
      document.getElementById('orderId').textContent = orderId;
    } else {
      document.getElementById('orderId').textContent = "N/A";
    }
  </script>
</body>
</html>
