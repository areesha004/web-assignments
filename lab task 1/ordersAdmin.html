<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Orders</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4">All Orders</h1>

    <table class="table table-striped table-bordered">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Customer Name</th>
          <th>Email</th>
          <th>Total Amount</th>
          <th>Order Status</th>
          <th>Created At</th>
        </tr>
      </thead>
      <tbody id="ordersTableBody">
        <tr><td colspan="6" class="text-center">Loading orders...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    $(document).ready(function() {
      $.ajax({
        url: "http://localhost:3000/api/orders/get", 
        method: "GET",
        success: function(orders) {
          const tbody = $("#ordersTableBody");
          tbody.empty(); 

          if (orders.length === 0) {
            tbody.append('<tr><td colspan="6" class="text-center">No orders found.</td></tr>');
            return;
          }

          orders.forEach((order, index) => {
            const row = `
              <tr>
                <td>${index + 1}</td>
                <td>${order.customerName}</td>
                <td>${order.email}</td>
                <td>Rs ${order.totalAmount}</td>
                <td>${order.orderStatus}</td>
                <td>${new Date(order.createdAt).toLocaleString()}</td>
              </tr>
            `;
            tbody.append(row);
          });
        },
        error: function(err) {
          console.error("Failed to fetch orders:", err);
          $("#ordersTableBody").html('<tr><td colspan="6" class="text-center text-danger">Failed to load orders.</td></tr>');
        }
      });
    });
  </script>
</body>
</html>
